<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wave Lab v4.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
/* Layout: sticky header with view tabs; Waves = all lanes on the left, one inspector for the selected ball on the right; Bounce Lab = plots left, controls and fact card right. */
:root {
  --bg: #F2F7F3;
  --surface: #FFFFFF;
  --surface-2: #E7F0E9;
  --line: #D2E1D7;
  --ink: #15301F;
  --ink-2: #4C6757;
  --brand: #1E5B3A;
  --on-brand: #FFFFFF;
  --sun: #FFD23F;
  --on-sun: #2B2300;
  --pink: #C72A66;
  --focus: #2F7BE0;
  --cv-bg: #F1F8F3;
  --cv-grid: rgba(30, 91, 58, 0.22);
  --cv-ground: #3E7B3A;
  --cv-blue: #2F78D0;
  --cv-orange: #EE6A45;
  --font: 'Bricolage Grotesque', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1713; --surface: #15231C; --surface-2: #1E3027; --line: #2B4034; --ink: #E6F2EA; --ink-2: #9DB7A8;
    --brand: #6FD59A; --on-brand: #08170E; --pink: #FF7DA8; --focus: #7DB4FF;
    --cv-bg: #101D16; --cv-grid: rgba(230, 242, 234, 0.2); --cv-ground: #3E7B3A; --cv-blue: #6FA8FF; --cv-orange: #FF8A66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1713; --surface: #15231C; --surface-2: #1E3027; --line: #2B4034; --ink: #E6F2EA; --ink-2: #9DB7A8;
  --brand: #6FD59A; --on-brand: #08170E; --pink: #FF7DA8; --focus: #7DB4FF;
  --cv-bg: #101D16; --cv-grid: rgba(230, 242, 234, 0.2); --cv-ground: #3E7B3A; --cv-blue: #6FA8FF; --cv-orange: #FF8A66;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: var(--brand); }
h1, h2, h3, p { margin: 0; }
output { font-variant-numeric: tabular-nums; }

.wrap {
  max-width: 1400px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Buttons */
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--surface); font-weight: 700; font-size: 15px; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .12s, border-color .12s;
}
.btn:hover:not(:disabled) { border-color: var(--brand); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.sun { background: var(--sun); border-color: var(--sun); color: var(--on-sun); }
.btn.on { background: var(--surface-2); border-color: var(--brand); }
.btn.icon { width: 44px; padding: 0; font-size: 20px; }
.btn svg { width: 20px; height: 20px; flex: none; }

.seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface-2); border-radius: 14px; }
.seg button {
  min-height: 40px; padding: 0 16px; border: 0; border-radius: 11px; background: transparent;
  font-weight: 700; font-size: 15px; color: var(--ink-2); white-space: nowrap;
}
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--brand); }
.brand svg { width: 38px; height: 24px; }
.brand h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; color: var(--ink); }
.ver { font-size: 13px; font-weight: 800; background: var(--sun); color: var(--on-sun); padding: 4px 9px; border-radius: 99px; }
.tabs { order: 2; margin-left: 4px; }
.sound { margin-left: auto; display: flex; align-items: center; gap: 12px; order: 3; }
.sound input[type=range] { width: 150px; }
.sound output { width: 44px; text-align: right; font-weight: 800; color: var(--ink-2); }

/* Range slider */
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 36px; margin: 0;
  background: transparent; cursor: pointer; --pct: 0%; touch-action: pan-y;
}
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 99px; background: linear-gradient(to right, var(--brand) var(--pct), var(--surface-2) var(--pct)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -9px; border-radius: 50%; background: var(--brand); border: 4px solid var(--sun); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 99px; background: var(--surface-2); }
input[type=range]::-moz-range-progress { height: 10px; border-radius: 99px; background: var(--brand); }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--brand); border: 4px solid var(--sun); }
input[type=range]:disabled { opacity: .4; cursor: not-allowed; }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { outline: 3px solid var(--focus); outline-offset: 2px; }
input[type=range]:focus-visible::-moz-range-thumb { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Switch */
.switch { flex: none; position: relative; width: 56px; height: 32px; padding: 0; border-radius: 99px; border: 0; background: var(--line); transition: background .15s; }
.switch .knob { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"] .knob { transform: translateX(24px); }
.switch.rainbow[aria-checked="true"] { background: linear-gradient(90deg, #FF5A5A, #FFD23F, #5DB75A, #4A90E2, #B57BE0); }
.switch.pink[aria-checked="true"] { background: var(--pink); }

/* Toolbar + panels */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 14px 10px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper b { min-width: 92px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.toolbar .spacer { flex: 1; }
.panel { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.panel[hidden] { display: none; }
.panel .file { flex: 0 1 240px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-weight: 600; }
.player { flex: 1 1 320px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.player[hidden] { display: none; }
.player input[type=range] { flex: 1; min-width: 80px; }
.player output { font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.field {
  min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--ink); font-weight: 600; min-width: 0;
}
.status { color: var(--ink-2); font-weight: 600; }
.themes { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; }
.chip { min-height: 44px; padding: 0 14px 0 8px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.chip i { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
.chip[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1.5px var(--brand); }
.opt { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; min-height: 44px; }
.custom { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; flex: 1 1 100%; }
.custom[hidden] { display: none; }
.custom label { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
input[type=color] { width: 52px; height: 40px; padding: 2px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }

/* Workspace */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-bottom: 24px; align-items: start; }
@media (min-width: 980px) { .workspace { grid-template-columns: minmax(0, 1fr) 360px; } .inspector { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100dvh - 90px); overflow-y: auto; } }
.stage { display: grid; gap: 8px; }
.lane { position: relative; height: var(--lane-h, 140px); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; --c: #888; }
.lane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lane.sel { outline: 3px solid var(--c); outline-offset: -3px; }
.tag {
  position: absolute; top: 8px; right: 8px; min-height: 32px; padding: 0 12px 0 8px; border: 0; border-radius: 99px;
  background: rgba(255,255,255,.92); color: #14301F; font-weight: 800; font-size: 14px;
  display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.25); max-width: calc(100% - 140px);
}
.tag .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); border: 2px solid #14301F; flex: none; }
.tag .sk { font-size: 16px; line-height: 1; }
.tag small { font-weight: 600; color: #4C6757; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Inspector */
.inspector { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; --c: #888; }
.insp-head { display: flex; align-items: center; gap: 10px; }
.insp-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; margin-right: auto; }
.insp-head h2 .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--c); border: 3px solid var(--ink); }
.insp-head .btn { min-height: 40px; padding: 0 12px; }
.inspector .seg { display: flex; }
.inspector .seg button { flex: 1; padding: 0 8px; }
.row { display: flex; flex-direction: column; gap: 2px; }
.row-head { display: flex; align-items: center; gap: 6px; min-height: 36px; }
.row-head label, .row-head .lbl { font-weight: 700; }
.row-head output { margin-left: auto; font-weight: 800; }
.row-head .switch { margin-left: auto; }
.help { position: relative; width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 1.5px solid var(--ink-2); background: transparent; color: var(--ink-2); font-weight: 800; font-size: 13px; line-height: 1; flex: none; }
.help::after { content: ""; position: absolute; inset: -10px; }
.help[aria-expanded="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.note { margin: 2px 0 6px; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; font-size: 14.5px; line-height: 1.45; text-wrap: pretty; }
.hint { font-size: 14px; color: var(--ink-2); padding: 8px 12px; border-radius: 12px; background: var(--surface-2); text-wrap: pretty; }
.badge { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: #fff; background: var(--pink); padding: 3px 7px; border-radius: 99px; }
:root[data-theme="dark"] .badge { color: #2B0A18; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { color: #2B0A18; } }
.grid-skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.grid-skins button { height: 48px; font-size: 26px; line-height: 1; padding: 0; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.grid-skins button[aria-pressed="true"] { border-color: var(--brand); background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--brand); }
.grid-skins.small { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); }
.grid-skins.small button { height: 40px; font-size: 22px; border-color: transparent; }
.section-title { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.color-row { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.color-row .lbl { font-weight: 700; margin-right: auto; }

/* Bounce Lab */
.bl { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 24px; align-items: start; }
@media (min-width: 980px) { .bl { grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); } }
.plots { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .plots { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.6fr); grid-template-rows: 1fr 1fr; height: min(560px, calc(100dvh - 150px)); min-height: 400px; } .plots .scene { grid-row: 1 / 3; } }
.plot { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--cv-bg); min-height: 150px; }
.plot.scene { min-height: 320px; }
.plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bl-side { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.bl-head { display: flex; align-items: center; gap: 8px; }
.bl-head h2 { font-size: 22px; font-weight: 800; margin-right: auto; letter-spacing: -0.01em; }
.bl-head .btn { min-height: 40px; padding: 0 14px; }
.planets { display: flex; }
.planets button { flex: 1; }
.fact { padding: 14px 16px; border-radius: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.fact .kicker { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--pink); text-transform: uppercase; }
.fact h3 { font-size: 20px; font-weight: 800; line-height: 1.2; }
.fact code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; background: var(--sun); color: var(--on-sun); padding: 6px 10px; border-radius: 10px; overflow-wrap: anywhere; }
.fact p { font-size: 15.5px; line-height: 1.5; text-wrap: pretty; }

.foot { padding-block: 8px 28px; text-align: center; font-weight: 600; }
.foot a { text-decoration: none; }
.foot a:hover { text-decoration: underline; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 720px) {
  .top .wrap { gap: 8px 12px; }
  .brand h1 { font-size: 24px; }
  .tabs { order: 4; flex: 1 1 100%; margin: 0; }
  .tabs button { flex: 1; }
  .tabs { display: flex; }
  .sound { order: 2; gap: 8px; }
  .sound input[type=range] { width: 96px; }
  .sound output { display: none; }
  .sound .mlbl { display: none; }
  .sound .btn { width: 44px; padding: 0; }
  .ver { display: none; }
}
@media (prefers-reduced-motion: reduce) { .switch, .switch .knob, .btn { transition: none; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 40 24" aria-hidden="true"><path d="M2 12 C8 0, 14 0, 20 12 S32 24, 38 12" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="12" r="4.5" fill="var(--sun)" stroke="currentColor" stroke-width="2.5"/></svg>
      <h1>Wave Lab</h1><span class="ver">v4.0</span>
    </div>
    <nav class="seg tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-waves" aria-selected="true">Waves</button>
      <button type="button" role="tab" id="tab-bounce" aria-selected="false">Bounce Lab</button>
    </nav>
    <div class="sound">
      <button type="button" class="btn sun" id="muteBtn" aria-pressed="true"></button>
      <input id="masterVol" type="range" min="0" max="100" step="1" value="80" aria-label="Master volume">
      <output id="masterOut" for="masterVol">80%</output>
    </div>
  </div>
</header>

<main>
  <section id="view-waves" aria-labelledby="tab-waves">
    <div class="wrap">
      <div class="toolbar">
        <div class="stepper" role="group" aria-label="Number of balls">
          <button type="button" class="btn icon" id="ballMinus" aria-label="Remove a ball">&minus;</button>
          <b id="ballCount">1 ball</b>
          <button type="button" class="btn icon" id="ballPlus" aria-label="Add a ball">+</button>
        </div>
        <div class="seg" role="group" aria-label="Tools">
          <button type="button" id="pn-music" aria-pressed="false">Music</button>
          <button type="button" id="pn-setups" aria-pressed="false">Setups</button>
          <button type="button" id="pn-style" aria-pressed="false">Style</button>
        </div>
      </div>

      <div class="panel" id="panel-music" hidden>
        <div class="seg" role="group" aria-label="Input mode">
          <button type="button" id="modeManual" aria-pressed="true">Manual</button>
          <button type="button" id="modeAudio" aria-pressed="false" disabled>Music file</button>
        </div>
        <label class="btn" for="fileIn">Upload audio</label>
        <input type="file" id="fileIn" class="visually-hidden" accept=".mp3,.wav,.m4a,audio/mpeg,audio/wav,audio/mp4,audio/x-m4a">
        <span class="file" id="fileName">No file loaded</span>
        <div class="player" id="player" hidden>
          <button type="button" class="btn icon sun" id="playBtn" aria-label="Play">&#9654;</button>
          <button type="button" class="btn icon" id="stopBtn" aria-label="Stop">&#9632;</button>
          <input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Seek">
          <output id="timeOut">0:00 / 0:00</output>
        </div>
      </div>

      <div class="panel" id="panel-setups" hidden>
        <input type="text" class="field" id="setupName" placeholder="Setup name" aria-label="Setup name" style="flex:0 1 220px">
        <button type="button" class="btn sun" id="saveSetup">Save setup</button>
        <select class="field" id="setupList" aria-label="Saved setups" style="flex:0 1 240px"></select>
        <button type="button" class="btn" id="loadSetup">Load</button>
        <button type="button" class="btn" id="delSetup">Delete</button>
        <span class="status" id="setupMsg" role="status"></span>
      </div>

      <div class="panel" id="panel-style" hidden>
        <div class="themes" id="themes" role="group" aria-label="Theme"></div>
        <div class="custom" id="customRow" hidden>
          <label>Background <input type="color" id="cBg" aria-label="Custom background"></label>
          <label>Wave line <input type="color" id="cWave" aria-label="Custom wave line"></label>
          <label>Accent <input type="color" id="cAccent" aria-label="Custom accent"></label>
        </div>
        <label class="opt" for="swWave"><button type="button" class="switch" role="switch" id="swWave" aria-checked="true"><span class="knob"></span></button> Show wave line</label>
        <label class="opt" for="swCalm"><button type="button" class="switch" role="switch" id="swCalm" aria-checked="false"><span class="knob"></span></button> Calm motion</label>
        <button type="button" class="btn" id="shuffleTheme">Surprise me</button>
      </div>

      <div class="workspace">
        <div class="stage" id="stage" aria-label="Ball lanes"></div>
        <aside class="inspector" id="inspector" aria-label="Ball controls"></aside>
      </div>
    </div>
  </section>

  <section id="view-bounce" aria-labelledby="tab-bounce" hidden>
    <div class="wrap">
      <div class="bl">
        <div class="plots">
          <div class="plot scene" data-fact="scene"><canvas id="cvScene"></canvas></div>
          <div class="plot" data-fact="hgraph"><canvas id="cvH"></canvas></div>
          <div class="plot" data-fact="vgraph"><canvas id="cvV"></canvas></div>
        </div>
        <div class="bl-side">
          <div class="bl-head">
            <h2>Bounce Lab</h2>
            <button type="button" class="btn sun" id="phPause">Pause</button>
            <button type="button" class="btn" id="phRestart">Restart</button>
          </div>
          <div class="seg planets" id="planets" role="group" aria-label="Planet" data-fact="planet"></div>
          <div id="phSliders" style="display:flex;flex-direction:column;gap:6px"></div>
          <div class="row" data-fact="sound">
            <div class="row-head">
              <label for="phSound">Bounce sound <span id="soundHint" class="status"></span></label>
              <button type="button" class="switch" role="switch" id="phSound" aria-checked="true"><span class="knob"></span></button>
            </div>
          </div>
          <div class="fact" role="note" aria-live="polite">
            <span class="kicker">Physics fact &middot; point at anything</span>
